<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MET & Vermoeidheid Tracker</title>
  <style>
    :root {
      --bg-color: #f4f4f9;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --text: #333333;
      --border: #dddddd;
      --danger: #e74c3c;
      --thumb-color: #2ecc71;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    h2 {
      margin: 4px 0 12px 0;
      font-size: 20px;
      text-align: center;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 16px;
      color: #1a1a1a;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 13px;
    }
    input[type="text"], input[type="number"], input[type="date"], select {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      background-color: var(--primary);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-small {
      width: auto;
      padding: 6px 12px;
      font-size: 13px;
    }
    .btn-secondary {
      background-color: #7f8c8d;
    }
    .btn-danger {
      background-color: var(--danger);
    }
    
    /* Datum Navigatie Balk */
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .date-nav button {
      width: 40px;
      height: 36px;
      padding: 0;
      font-size: 16px;
      flex-shrink: 0;
    }
    .date-nav input[type="date"] {
      margin-bottom: 0;
      text-align: center;
      height: 36px;
    }

    /* Compacte Vermoeidheid Cards */
    .fatigue-card {
      border-left: 6px solid #2ecc71;
      margin-bottom: 8px;
      padding: 8px 10px;
      background: #fafafa;
      border-radius: 6px;
    }
    .fatigue-meta {
      font-weight: bold;
      font-size: 12px;
      margin-top: 2px;
    }

    /* Custom Range Slider (Alleen de thumb verandert van kleur) */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      margin: 6px 0;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      transition: background-color 0.2s ease;
    }
    #fOchtend::-webkit-slider-thumb { background: var(--thumb-ochtend, #2ecc71); }
    #fAvond::-webkit-slider-thumb { background: var(--thumb-avond, #2ecc71); }

    .flex-gap {
      display: flex;
      gap: 8px;
    }

    .entry {
      border-bottom: 1px solid var(--border);
      padding: 6px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .entry:last-child {
      border-bottom: none;
    }
    .badge {
      background: #e1f0ff;
      color: var(--primary);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }

    /* Tabel 7 Dagen */
    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 6px;
    }
    .history-table th, .history-table td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: center;
    }
    .history-table th {
      background-color: #f0f4f8;
      font-weight: 600;
    }

    #fileInput { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h2>MET & Vermoeidheid Tracker</h2>

  <!-- Datum Selectie met Pjiltjes -->
  <div class="card">
    <label>📅 Datum selecteren:</label>
    <div class="date-nav">
      <button onclick="shiftDate(-1)">◀</button>
      <input type="date" id="selectedDate" onchange="changeDate()">
      <button onclick="shiftDate(1)">▶</button>
    </div>
  </div>

  <!-- Vermoeidheid Scores -->
  <div class="card">
    <h3>Vermoeidheid op <span class="dateDisplay"></span></h3>

    <!-- Ochtend -->
    <div class="fatigue-card" id="cardOchtend">
      <label for="fOchtend">🌅 Begin van de dag: <span id="valOchtend">1</span>/10</label>
      <input type="range" id="fOchtend" min="1" max="10" value="1" oninput="updateMeta('Ochtend', this.value)">
      <div class="fatigue-meta" id="metaOchtend">🟢 Fit / Normale energie</div>
    </div>

    <!-- Avond -->
    <div class="fatigue-card" id="cardAvond">
      <label for="fAvond">🌙 Einde van de dag: <span id="valAvond">1</span>/10</label>
      <input type="range" id="fAvond" min="1" max="10" value="1" oninput="updateMeta('Avond', this.value)">
      <div class="fatigue-meta" id="metaAvond">🟢 Fit / Normale energie</div>
    </div>

    <div style="text-align: right; margin-top: 8px;">
      <button onclick="saveFatigue()" class="btn-small">Opslaan</button>
    </div>
  </div>

  <!-- MET Invoer -->
  <div class="card">
    <h3>Activiteit Toevoegen</h3>
    <label for="actName">Activiteit</label>
    <input type="text" id="actName" placeholder="bijv. Wandelen, Lezen, Koken">
    
    <div class="flex-gap">
      <div style="flex: 1;">
        <label for="metVal">MET-score</label>
        <input type="number" id="metVal" step="0.1" placeholder="2.5">
      </div>
      <div style="flex: 1;">
        <label for="duration">Duur (min)</label>
        <input type="number" id="duration" placeholder="30">
      </div>
    </div>

    <div style="text-align: right;">
      <button onclick="addActivity()" class="btn-small">Activiteit Opslaan</button>
    </div>
  </div>

  <!-- Dagoverzicht & Logboek -->
  <div class="card">
    <h3>Logboek <span class="dateDisplay"></span></h3>
    <div id="logList">Nog geen activiteiten ingevoerd.</div>
    <hr style="border:none; border-top:1px solid #ddd; margin: 8px 0;">
    <p style="margin:0; font-size: 14px;"><strong>Totaal MET-punten: </strong><span id="totalMET" style="font-size:16px; color:var(--primary);">0</span></p>
  </div>

  <!-- Tabel Afgelopen 7 Dagen -->
  <div class="card">
    <h3>📊 Afgelopen 7 Dagen</h3>
    <table class="history-table">
      <thead>
        <tr>
          <th>Datum</th>
          <th>🌅 Och.</th>
          <th>🌙 Av.</th>
          <th>MET</th>
        </tr>
      </thead>
      <tbody id="historyTableBody">
        <!-- Gefilterde rijen worden hier opgebouwd -->
      </tbody>
    </table>
  </div>

  <!-- Back-up & Data Beheer -->
  <div class="card">
    <h3>Data Beheer</h3>
    <div class="flex-gap" style="margin-bottom: 8px;">
      <button onclick="exportData()" class="btn-secondary btn-small" style="flex:1;">Exporteer Data</button>
      <button onclick="document.getElementById('fileInput').click()" class="btn-secondary btn-small" style="flex:1;">Importeer Data</button>
    </div>
    <button onclick="clearAllData()" class="btn-danger btn-small" style="width:100%;">Wis Alle Data</button>
    <input type="file" id="fileInput" accept=".json" onchange="importData(event)">
  </div>
</div>

<script>
  let trackerData = JSON.parse(localStorage.getItem('metTrackerData')) || {
    fatigueLogs: {},
    activities: []
  };

  let currentDate = new Date().toISOString().split('T')[0];
  document.getElementById('selectedDate').value = currentDate;

  const fatigueMetaMap = {
    1: { text: "🟢 1 - Fit / Volledige energie", color: "#2ecc71" },
    2: { text: "🟢 2 - Lichte energieafname", color: "#27ae60" },
    3: { text: "🟡 3 - Milde vermoeidheid", color: "#f1c40f" },
    4: { text: "🟡 4 - Duidelijk merkbare moeheid", color: "#f39c12" },
    5: { text: "🟠 5 - Matige vermoeidheid / Rust nodig", color: "#e67e22" },
    6: { text: "🟠 6 - Zware vermoeidheid", color: "#d35400" },
    7: { text: "🔴 7 - Zeer zwaar / Batterij bijna leeg", color: "#e74c3c" },
    8: { text: "🔴 8 - Uitgeput / Minimale belastbaarheid", color: "#c0392b" },
    9: { text: "🟣 9 - Extreem uitgeput / Platliggen", color: "#8e44ad" },
    10: { text: "🟣 10 - Maximale uitputting / Crash", color: "#6c3483" }
  };

  function shiftDate(offset) {
    let d = new Date(currentDate);
    d.setDate(d.getDate() + offset);
    currentDate = d.toISOString().split('T')[0];
    document.getElementById('selectedDate').value = currentDate;
    render();
  }

  function changeDate() {
    currentDate = document.getElementById('selectedDate').value;
    render();
  }

  function updateMeta(type, val) {
    document.getElementById('val' + type).innerText = val;
    const meta = fatigueMetaMap[val] || fatigueMetaMap[1];
    const metaDiv = document.getElementById('meta' + type);
    const card = document.getElementById('card' + type);
    
    metaDiv.innerText = meta.text;
    metaDiv.style.color = meta.color;
    card.style.borderLeftColor = meta.color;

    // Stel dynamische thumb-kleur in
    document.documentElement.style.setProperty(`--thumb-${type.toLowerCase()}`, meta.color);
  }

  function saveData() {
    localStorage.setItem('metTrackerData', JSON.stringify(trackerData));
    render();
  }

  function saveFatigue() {
    if (!trackerData.fatigueLogs[currentDate]) {
      trackerData.fatigueLogs[currentDate] = {};
    }
    trackerData.fatigueLogs[currentDate].ochtend = document.getElementById('fOchtend').value;
    trackerData.fatigueLogs[currentDate].avond = document.getElementById('fAvond').value;
    
    saveData();
    alert(`Vermoeidheid opgeslagen voor ${currentDate}`);
  }

  function addActivity() {
    const name = document.getElementById('actName').value;
    const met = parseFloat(document.getElementById('metVal').value);
    const dur = parseInt(document.getElementById('duration').value);

    if (!name || isNaN(met) || isNaN(dur)) {
      alert('Vul a.u.b. alle velden in.');
      return;
    }

    const points = (met * (dur / 60)).toFixed(1);

    trackerData.activities.push({
      id: Date.now(),
      date: currentDate,
      name: name,
      met: met,
      duration: dur,
      points: parseFloat(points)
    });

    document.getElementById('actName').value = '';
    document.getElementById('metVal').value = '';
    document.getElementById('duration').value = '';

    saveData();
  }

  function deleteAct(id) {
    trackerData.activities = trackerData.activities.filter(a => a.id !== id);
    saveData();
  }

  function render() {
    document.querySelectorAll('.dateDisplay').forEach(el => {
      el.innerText = currentDate;
    });

    // Vermoeidheid laders
    const fToday = trackerData.fatigueLogs[currentDate] || {};
    ['Ochtend', 'Avond'].forEach(type => {
      const key = type.toLowerCase();
      const val = fToday[key] || 1;
      document.getElementById('f' + type).value = val;
      updateMeta(type, val);
    });

    // Logboek Vandaag
    const list = document.getElementById('logList');
    const dayActs = trackerData.activities.filter(a => a.date === currentDate);

    if (dayActs.length === 0) {
      list.innerHTML = `<i>Geen activiteiten op ${currentDate}.</i>`;
      document.getElementById('totalMET').innerText = '0';
    } else {
      let html = '';
      let total = 0;
      dayActs.forEach(a => {
        total += a.points;
        html += `
          <div class="entry">
            <div>
              <strong>${a.name}</strong><br>
              <small>${a.duration} min | MET ${a.met}</small>
            </div>
            <div>
              <span class="badge">${a.points} ptn</span>
              <button onclick="deleteAct(${a.id})" class="btn-danger btn-small" style="padding:2px 6px; margin-left:4px;">X</button>
            </div>
          </div>
        `;
      });
      list.innerHTML = html;
      document.getElementById('totalMET').innerText = total.toFixed(1);
    }

    // Tabel 7 dagen vullen
    renderHistoryTable();
  }

  function renderHistoryTable() {
    const tbody = document.getElementById('historyTableBody');
    tbody.innerHTML = '';

    // Genereer de afgelopen 7 dagen vanaf de geselecteerde datum
    let dates = [];
    let baseDate = new Date(currentDate);

    for (let i = 6; i >= 0; i--) {
      let d = new Date(baseDate);
      d.setDate(d.getDate() - i);
      dates.push(d.toISOString().split('T')[0]);
    }

    dates.forEach(dStr => {
      const fLog = trackerData.fatigueLogs[dStr] || {};
      const ochtend = fLog.ochtend || '-';
      const avond = fLog.avond || '-';

      let totalMET = 0;
      trackerData.activities.filter(a => a.date === dStr).forEach(a => {
        totalMET += a.points;
      });

      const isCurrent = (dStr === currentDate);
      const rowHtml = `
        <tr style="${isCurrent ? 'background-color: #e1f0ff; font-weight:bold;' : ''}">
          <td>${dStr.slice(5)}</td>
          <td>${ochtend}</td>
          <td>${avond}</td>
          <td>${totalMET > 0 ? totalMET.toFixed(1) : '-'}</td>
        </tr>
      `;
      tbody.innerHTML += rowHtml;
    });
  }

  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(trackerData, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `met_tracker_backup_${currentDate}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function importData(event) {
    const fileReader = new FileReader();
    fileReader.onload = function(e) {
      try {
        const imported = JSON.parse(e.target.result);
        if (imported.activities && imported.fatigueLogs) {
          trackerData = imported;
          saveData();
          alert('Data succesvol geïmporteerd!');
        } else {
          alert('Ongeldig back-up bestand.');
        }
      } catch (err) {
        alert('Fout bij het lezen van het bestand.');
      }
    };
    if (event.target.files[0]) {
      fileReader.readAsText(event.target.files[0]);
    }
  }

  function clearAllData() {
    if (confirm("Weet je zeker dat je alle opgeslagen gegevens wilt wissen?")) {
      localStorage.removeItem('metTrackerData');
      trackerData = { fatigueLogs: {}, activities: [] };
      render();
      alert("Alle gegevens zijn gewist.");
    }
  }

  render();
</script>

</body>
</html>
