<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MET & Vermoeidheid Tracker</title>
  <style>
    :root {
      --bg-color: #f4f4f9;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --text: #333333;
      --border: #dddddd;
      --danger: #e74c3c;
      --success: #2ecc71;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 15px;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    h2, h3 {
      margin-top: 0;
      color: #1a1a1a;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      background-color: var(--primary);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button.btn-secondary {
      background-color: #7f8c8d;
    }
    button.btn-danger {
      background-color: var(--danger);
    }
    .flex-gap {
      display: flex;
      gap: 10px;
    }
    .flex-gap button {
      margin-bottom: 0;
    }
    .entry {
      border-bottom: 1px solid var(--border);
      padding: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .entry:last-child {
      border-bottom: none;
    }
    .badge {
      background: #e1f0ff;
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
    }
    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>MET & Vermoeidheid Tracker</h2>

  <!-- Vermoeidheid Score -->
  <div class="card">
    <h3>Vermoeidheid Vandaag</h3>
    <label for="fatigue">Score (1 = fit, 10 = extreem moe): <span id="fatigueVal">5</span></label>
    <input type="range" id="fatigue" min="1" max="10" value="5" oninput="document.getElementById('fatigueVal').innerText=this.value">
    <button onclick="saveFatigue()">Vermoeidheid Opslaan</button>
  </div>

  <!-- MET Invoer -->
  <div class="card">
    <h3>Activiteit Toevoegen</h3>
    <label for="actName">Activiteit</label>
    <input type="text" id="actName" placeholder="bijv. Wandelen, Lezen, Koken">
    
    <label for="metVal">MET-score</label>
    <input type="number" id="metVal" step="0.1" placeholder="bijv. 2.5">
    
    <label for="duration">Duur (minuten)</label>
    <input type="number" id="duration" placeholder="bijv. 30">

    <button onclick="addActivity()">Activiteit Opslaan</button>
  </div>

  <!-- Dagoverzicht -->
  <div class="card">
    <h3>Logboek Vandaag</h3>
    <div id="logList">Nog geen activiteiten ingevoerd.</div>
    <p><strong>Totaal MET-punten: </strong><span id="totalMET">0</span></p>
  </div>

  <!-- Back-up & Beheer -->
  <div class="card">
    <h3>Back-up & Data Beheer</h3>
    <div class="flex-gap">
      <button onclick="exportData()" class="btn-secondary">Exporteer Data</button>
      <button onclick="document.getElementById('fileInput').click()" class="btn-secondary">Importeer Data</button>
    </div>
    <input type="file" id="fileInput" accept=".json" onchange="importData(event)">
  </div>
</div>

<script>
  let trackerData = JSON.parse(localStorage.getItem('metTrackerData')) || {
    fatigueLogs: {},
    activities: []
  };

  const today = new Date().toISOString().split('T')[0];

  function saveData() {
    localStorage.setItem('metTrackerData', JSON.stringify(trackerData));
    render();
  }

  function saveFatigue() {
    const val = document.getElementById('fatigue').value;
    trackerData.fatigueLogs[today] = val;
    saveData();
    alert('Vermoeidheidsscore opgeslagen!');
  }

  function addActivity() {
    const name = document.getElementById('actName').value;
    const met = parseFloat(document.getElementById('metVal').value);
    const dur = parseInt(document.getElementById('duration').value);

    if (!name || isNaN(met) || isNaN(dur)) {
      alert('Vul a.u.b. alle velden correct in.');
      return;
    }

    const points = (met * (dur / 60)).toFixed(1);

    trackerData.activities.push({
      id: Date.now(),
      date: today,
      name: name,
      met: met,
      duration: dur,
      points: parseFloat(points)
    });

    document.getElementById('actName').value = '';
    document.getElementById('metVal').value = '';
    document.getElementById('duration').value = '';

    saveData();
  }

  function deleteAct(id) {
    trackerData.activities = trackerData.activities.filter(a => a.id !== id);
    saveData();
  }

  function render() {
    // Set fatigue for today if exists
    if (trackerData.fatigueLogs[today]) {
      document.getElementById('fatigue').value = trackerData.fatigueLogs[today];
      document.getElementById('fatigueVal').innerText = trackerData.fatigueLogs[today];
    }

    // Render today activities
    const list = document.getElementById('logList');
    const todayActs = trackerData.activities.filter(a => a.date === today);

    if (todayActs.length === 0) {
      list.innerHTML = '<i>Nog geen activiteiten ingevoerd voor vandaag.</i>';
      document.getElementById('totalMET').innerText = '0';
      return;
    }

    let html = '';
    let total = 0;

    todayActs.forEach(a => {
      total += a.points;
      html += `
        <div class="entry">
          <div>
            <strong>${a.name}</strong><br>
            <small>${a.duration} min | MET ${a.met}</small>
          </div>
          <div>
            <span class="badge">${a.points} ptn</span>
            <button onclick="deleteAct(${a.id})" class="btn-danger" style="width:auto; padding:4px 8px; margin:0 0 0 5px;">X</button>
          </div>
        </div>
      `;
    });

    list.innerHTML = html;
    document.getElementById('totalMET').innerText = total.toFixed(1);
  }

  // --- Export & Import functionaliteit ---
  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(trackerData, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `met_tracker_backup_${today}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function importData(event) {
    const fileReader = new FileReader();
    fileReader.onload = function(e) {
      try {
        const imported = JSON.parse(e.target.result);
        if (imported.activities && imported.fatigueLogs) {
          trackerData = imported;
          saveData();
          alert('Data succesvol geïmporteerd!');
        } else {
          alert('Ongeldig back-up bestand.');
        }
      } catch (err) {
        alert('Fout bij het lezen van het bestand.');
      }
    };
    if (event.target.files[0]) {
      fileReader.readAsText(event.target.files[0]);
    }
  }

  render();
</script>

</body>
</html>
