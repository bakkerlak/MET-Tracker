<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MET & Vermoeidheid Tracker</title>
  <!-- Chart.js bibliotheek voor de grafiek -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #f4f4f9;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --text: #333333;
      --border: #dddddd;
      --danger: #e74c3c;
      --thumb-color: #2ecc71;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    h2 {
      margin: 4px 0 12px 0;
      font-size: 20px;
      text-align: center;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 16px;
      color: #1a1a1a;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 13px;
    }
    input[type="text"], input[type="number"], input[type="date"], select {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      background-color: var(--primary);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-small {
      width: auto;
      padding: 6px 12px;
      font-size: 13px;
    }
    .btn-secondary {
      background-color: #7f8c8d;
    }
    .btn-danger {
      background-color: var(--danger);
    }
    
    /* Datum Navigatie Balk */
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .date-nav button {
      width: 40px;
      height: 36px;
      padding: 0;
      font-size: 16px;
      flex-shrink: 0;
    }
    .date-nav input[type="date"] {
      margin-bottom: 0;
      text-align: center;
      height: 36px;
    }

    /* Compacte Vermoeidheid Cards */
    .fatigue-card {
      border-left: 6px solid #2ecc71;
      margin-bottom: 8px;
      padding: 8px 10px;
      background: #fafafa;
      border-radius: 6px;
    }
    .fatigue-meta {
      font-weight: bold;
      font-size: 12px;
      margin-top: 2px;
    }

    /* Custom Range Slider */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      margin: 6px 0;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      transition: background-color 0.2s ease;
    }
    #fOchtend::-webkit-slider-thumb { background: var(--thumb-ochtend, #2ecc71); }
    #fAvond::-webkit-slider-thumb { background: var(--thumb-avond, #2ecc71); }

    .flex-gap {
      display: flex;
      gap: 8px;
    }

    .entry {
      border-bottom: 1px solid var(--border);
      padding: 6px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .entry:last-child {
      border-bottom: none;
    }
    .badge {
      background: #e1f0ff;
      color: var(--primary);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }

    /* Grafiek Container */
    .chart-container {
      position: relative;
      height: 240px;
      width: 100%;
    }

    #fileInput { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h2>MET & Vermoeidheid Tracker</h2>

  <!-- Datum Selectie met Pijltjes -->
  <div class="card">
    <label>📅 Datum selecteren:</label>
    <div class="date-nav">
      <button onclick="shiftDate(-1)">◀</button>
      <input type="date" id="selectedDate" onchange="changeDate()">
      <button onclick="shiftDate(1)">▶</button>
    </div>
  </div>

  <!-- Vermoeidheid Scores -->
  <div class="card">
    <h3>Vermoeidheid op <span class="dateDisplay"></span></h3>

    <!-- Ochtend -->
    <div class="fatigue-card" id="cardOchtend">
      <label for="fOchtend">🌅 Begin van de dag: <span id="valOchtend">1</span>/10</label>
      <input type="range" id="fOchtend" min="1" max="10" value="1" oninput="updateMeta('Ochtend', this.value)">
      <div class="fatigue-meta" id="metaOchtend">🟢 Fit / Normale energie</div>
    </div>

    <!-- Avond -->
    <div class="fatigue-card" id="cardAvond">
      <label for="fAvond">🌙 Einde van de dag: <span id="valAvond">1</span>/10</label>
      <input type="range" id="fAvond" min="1" max="10" value="1" oninput="updateMeta('Avond', this.value)">
      <div class="fatigue-meta" id="metaAvond">🟢 Fit / Normale energie</div>
    </div>

    <div style="text-align: right; margin-top: 8px;">
      <button onclick="saveFatigue()" class="btn-small">Opslaan</button>
    </div>
  </div>

  <!-- MET Invoer & Database Snelkeuze -->
  <div class="card">
    <h3>Activiteit Toevoegen</h3>
    
    <label for="presetSelect">Kies uit MET-Database (optioneel):</label>
    <select id="presetSelect" onchange="selectPreset()">
      <option value="">-- Kies een standaard activiteit --</option>
      <option value="Rusten / Slapen|0.9">Rusten / Slapen (MET 0.9)</option>
      <option value="Tv kijken / Zitten|1.3">Tv kijken / Zitten (MET 1.3)</option>
      <option value="Lezen / Bellen|1.3">Lezen / Bellen (MET 1.3)</option>
      <option value="Computerwerk / Bureau|1.5">Computerwerk / Bureau (MET 1.5)</option>
      <option value="Eten / Praten|1.5">Eten / Praten (MET 1.5)</option>
      <option value="Staand werk / Douchen|2.0">Staand werk / Douchen (MET 2.0)</option>
      <option value="Koken / Afwassen|2.5">Koken / Afwassen (MET 2.5)</option>
      <option value="Licht huishoudelijk werk|2.8">Licht huishoudelijk werk (MET 2.8)</option>
      <option value="Wandelen (rustig tempo)|3.0">Wandelen rustig (MET 3.0)</option>
      <option value="Boodschappen doen|3.5">Boodschappen doen (MET 3.5)</option>
      <option value="Stofzuigen / Schoonmaken|3.5">Stofzuigen / Schoonmaken (MET 3.5)</option>
      <option value="Fietsen (rustig tempo)|4.0">Fietsen rustig (MET 4.0)</option>
      <option value="Wandelen (stevig tempo)|4.3">Wandelen stevig (MET 4.3)</option>
      <option value="Tuinieren|4.5">Tuinieren (MET 4.5)</option>
      <option value="Fietsen (gemiddeld tempo)|6.8">Fietsen gemiddeld (MET 6.8)</option>
      <option value="Hardlopen / Sporten|8.0">Hardlopen / Sporten (MET 8.0)</option>
    </select>

    <label for="actName">Activiteit Naam</label>
    <input type="text" id="actName" placeholder="bijv. Wandelen, Lezen, Koken">
    
    <div class="flex-gap">
      <div style="flex: 1;">
        <label for="metVal">MET-score</label>
        <input type="number" id="metVal" step="0.1" placeholder="2.5">
      </div>
      <div style="flex: 1;">
        <label for="duration">Duur (min)</label>
        <input type="number" id="duration" placeholder="30">
      </div>
    </div>

    <div style="text-align: right;">
      <button onclick="addActivity()" class="btn-small">Activiteit Opslaan</button>
    </div>
  </div>

  <!-- Dagoverzicht & Logboek -->
  <div class="card">
    <h3>Logboek <span class="dateDisplay"></span></h3>
    <div id="logList">Nog geen activiteiten ingevoerd.</div>
    <hr style="border:none; border-top:1px solid #ddd; margin: 8px 0;">
    <p style="margin:0; font-size: 14px;"><strong>Totaal MET-punten: </strong><span id="totalMET" style="font-size:16px; color:var(--primary);">0</span></p>
  </div>

  <!-- Grafiek Afgelopen 7 Dagen -->
  <div class="card">
    <h3>📈 Grafiek Afgelopen 7 Dagen</h3>
    <div class="chart-container">
      <canvas id="historyChart"></canvas>
    </div>
  </div>

  <!-- Back-up & Data Beheer -->
  <div class="card">
    <h3>Data Beheer</h3>
    <div class="flex-gap" style="margin-bottom: 8px;">
      <button onclick="exportData()" class="btn-secondary btn-small" style="flex:1;">Exporteer Data</button>
      <button onclick="document.getElementById('fileInput').click()" class="btn-secondary btn-small" style="flex:1;">Importeer Data</button>
    </div>
    <button onclick="clearAllData()" class="btn-danger btn-small" style="width:100%;">Wis Alle Data</button>
    <input type="file" id="fileInput" accept=".json" onchange="importData(event)">
  </div>
</div>

<script>
  let trackerData = JSON.parse(localStorage.getItem('metTrackerData')) || {
    fatigueLogs: {},
    activities: []
  };

  let currentDate = new Date().toISOString().split('T')[0];
  document.getElementById('selectedDate').value = currentDate;
  let historyChart = null;

  const fatigueMetaMap = {
    1: { text: "🟢 1 - Fit / Volledige energie", color: "#2ecc71" },
    2: { text: "🟢 2 - Lichte energieafname", color: "#27ae60" },
    3: { text: "🟡 3 - Milde vermoeidheid", color: "#f1c40f" },
    4: { text: "🟡 4 - Duidelijk merkbare moeheid", color: "#f39c12" },
    5: { text: "🟠 5 - Matige vermoeidheid / Rust nodig", color: "#e67e22" },
    6: { text: "🟠 6 - Zware vermoeidheid", color: "#d35400" },
    7: { text: "🔴 7 - Zeer zwaar / Batterij bijna leeg", color: "#e74c3c" },
    8: { text: "🔴 8 - Uitgeput / Minimale belastbaarheid", color: "#c0392b" },
    9: { text: "🟣 9 - Extreem uitgeput / Platliggen", color: "#8e44ad" },
    10: { text: "🟣 10 - Maximale uitputting / Crash", color: "#6c3483" }
  };

  function selectPreset() {
    const val = document.getElementById('presetSelect').value;
    if (val) {
      const parts = val.split('|');
      document.getElementById('actName').value = parts[0];
      document.getElementById('metVal').value = parts[1];
    }
  }

  function shiftDate(offset) {
    let d = new Date(currentDate);
    d.setDate(d.getDate() + offset);
    currentDate = d.toISOString().split('T')[0];
    document.getElementById('selectedDate').value = currentDate;
    render();
  }

  function changeDate() {
    currentDate = document.getElementById('selectedDate').value;
    render();
  }

  function updateMeta(type, val) {
    document.getElementById('val' + type).innerText = val;
    const meta = fatigueMetaMap[val] || fatigueMetaMap[1];
    const metaDiv = document.getElementById('meta' + type);
    const card = document.getElementById('card' + type);
    
    metaDiv.innerText = meta.text;
    metaDiv.style.color = meta.color;
    card.style.borderLeftColor = meta.color;

    document.documentElement.style.setProperty(`--thumb-${type.toLowerCase()}`, meta.color);
  }

  function saveData() {
    localStorage.setItem('metTrackerData', JSON.stringify(trackerData));
    render();
  }

  function saveFatigue() {
    if (!trackerData.fatigueLogs[currentDate]) {
      trackerData.fatigueLogs[currentDate] = {};
    }
    trackerData.fatigueLogs[currentDate].ochtend = document.getElementById('fOchtend').value;
    trackerData.fatigueLogs[currentDate].avond = document.getElementById('fAvond').value;
    
    saveData();
    alert(`Vermoeidheid opgeslagen voor ${currentDate}`);
  }

  function addActivity() {
    const name = document.getElementById('actName').value;
    const met = parseFloat(document.getElementById('metVal').value);
    const dur = parseInt(document.getElementById('duration').value);

    if (!name || isNaN(met) || isNaN(dur)) {
      alert('Vul a.u.b. alle velden in.');
      return;
    }

    const points = (met * (dur / 60)).toFixed(1);

    trackerData.activities.push({
      id: Date.now(),
      date: currentDate,
      name: name,
      met: met,
      duration: dur,
      points: parseFloat(points)
    });

    document.getElementById('actName').value = '';
    document.getElementById('metVal').value = '';
    document.getElementById('duration').value = '';
    document.getElementById('presetSelect').value = '';

    saveData();
  }

  function deleteAct(id) {
    trackerData.activities = trackerData.activities.filter(a => a.id !== id);
    saveData();
  }

  function render() {
    document.querySelectorAll('.dateDisplay').forEach(el => {
      el.innerText = currentDate;
    });

    const fToday = trackerData.fatigueLogs[currentDate] || {};
    ['Ochtend', 'Avond'].forEach(type => {
      const key = type.toLowerCase();
      const val = fToday[key] || 1;
      document.getElementById('f' + type).value = val;
      updateMeta(type, val);
    });

    const list = document.getElementById('logList');
    const dayActs = trackerData.activities.filter(a => a.date === currentDate);

    if (dayActs.length === 0) {
      list.innerHTML = `<i>Geen activiteiten op ${currentDate}.</i>`;
      document.getElementById('totalMET').innerText = '0';
    } else {
      let html = '';
      let total = 0;
      dayActs.forEach(a => {
        total += a.points;
        html += `
          <div class="entry">
            <div>
              <strong>${a.name}</strong><br>
              <small>${a.duration} min | MET ${a.met}</small>
            </div>
            <div>
              <span class="badge">${a.points} ptn</span>
              <button onclick="deleteAct(${a.id})" class="btn-danger btn-small" style="padding:2px 6px; margin-left:4px;">X</button>
            </div>
          </div>
        `;
      });
      list.innerHTML = html;
      document.getElementById('totalMET').innerText = total.toFixed(1);
    }

    renderChart();
  }

  function renderChart() {
    let dates = [];
    let labels = [];
    let ochtendData = [];
    let avondData = [];
    let metData = [];

    let baseDate = new Date(currentDate);

    for (let i = 6; i >= 0; i--) {
      let d = new Date(baseDate);
      d.setDate(d.getDate() - i);
      let dStr = d.toISOString().split('T')[0];
      dates.push(dStr);
      labels.push(dStr.slice(5)); // 'MM-DD'

      const fLog = trackerData.fatigueLogs[dStr] || {};
      ochtendData.push(fLog.ochtend ? parseFloat(fLog.ochtend) : null);
      avondData.push(fLog.avond ? parseFloat(fLog.avond) : null);

      let totalMET = 0;
      trackerData.activities.filter(a => a.date === dStr).forEach(a => {
        totalMET += a.points;
      });
      metData.push(totalMET > 0 ? parseFloat(totalMET.toFixed(1)) : 0);
    }

    const ctx = document.getElementById('historyChart').getContext('2d');

    if (historyChart) {
      historyChart.destroy();
    }

    historyChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          {
            type: 'line',
            label: '🌅 Och. Vermoeidheid',
            data: ochtendData,
            borderColor: '#f39c12',
            backgroundColor: '#f39c12',
            borderWidth: 2,
            tension: 0.2,
            yAxisID: 'yFatigue',
            spanGaps: true
          },
          {
            type: 'line',
            label: '🌙 Av. Vermoeidheid',
            data: avondData,
            borderColor: '#8e44ad',
            backgroundColor: '#8e44ad',
            borderWidth: 2,
            tension: 0.2,
            yAxisID: 'yFatigue',
            spanGaps: true
          },
          {
            type: 'bar',
            label: '⚡ MET-Punten',
            data: metData,
            backgroundColor: 'rgba(74, 144, 226, 0.4)',
            borderColor: '#4a90e2',
            borderWidth: 1,
            yAxisID: 'yMET'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          yFatigue: {
            type: 'linear',
            position: 'left',
            min: 1,
            max: 10,
            title: {
              display: true,
              text: 'Vermoeidheid (1-10)',
              font: { size: 10 }
            },
            ticks: { stepSize: 2 }
          },
          yMET: {
            type: 'linear',
            position: 'right',
            beginAtZero: true,
            title: {
              display: true,
              text: 'MET-punten',
              font: { size: 10 }
            },
            grid: {
              drawOnChartArea: false
            }
          }
        },
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              boxWidth: 12,
              font: { size: 11 }
            }
          }
        }
      }
    });
  }

  function exportData() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(trackerData, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `met_tracker_backup_${currentDate}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function importData(event) {
    const fileReader = new FileReader();
    fileReader.onload = function(e) {
      try {
        const imported = JSON.parse(e.target.result);
        if (imported.activities && imported.fatigueLogs) {
          trackerData = imported;
          saveData();
          alert('Data succesvol geïmporteerd!');
        } else {
          alert('Ongeldig back-up bestand.');
        }
      } catch (err) {
        alert('Fout bij het lezen van het bestand.');
      }
    };
    if (event.target.files[0]) {
      fileReader.readAsText(event.target.files[0]);
    }
  }

  function clearAllData() {
    if (confirm("Weet je zeker dat je alle opgeslagen gegevens wilt wissen?")) {
      localStorage.removeItem('metTrackerData');
      trackerData = { fatigueLogs: {}, activities: [] };
      render();
      alert("Alle gegevens zijn gewist.");
    }
  }

  render();
</script>

</body>
</html>
